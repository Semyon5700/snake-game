<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Змейка</title>
    <style>
        body { margin:0; padding:20px; text-align:center; background:#111; color:#0f0; font-family:monospace; }
        canvas { border:2px solid #0f0; background:#000; }
        .info { margin:10px; font-size:20px; }
        .game-over { color:#f00; font-size:24px; margin:10px; display:none; }
        button { background:#0f0; border:none; padding:10px 20px; font-size:16px; cursor:pointer; margin:5px; }
    </style>
</head>
<body>
    <div class="info">Счёт: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>
    <div class="game-over" id="gameOver">Игра окончена! <br> Счёт: <span id="finalScore">0</span></div>
    <div>
        <button onclick="startGame()">Старт</button>
        <button onclick="pauseGame()">Пауза</button>
    </div>
    <div style="margin-top:20px; font-size:14px; color:#888;">
        Управление: стрелки ←↑→↓
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        let snake = [{x:10, y:10}];
        let food = {x:15, y:15};
        let dx = 0, dy = 0;
        let score = 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop;

        function init() {
            canvas.width = 400;
            canvas.height = 400;
            draw();
            document.addEventListener('keydown', changeDirection);
        }

        function startGame() {
            if (gameRunning) return;
            snake = [{x:10, y:10}];
            food = generateFood();
            dx = gridSize; dy = 0;
            score = 0;
            gameRunning = true;
            gamePaused = false;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
            clearInterval(gameLoop);
            gameLoop = setInterval(update, 100);
        }

        function pauseGame() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            if (gamePaused) {
                clearInterval(gameLoop);
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#0f0';
                ctx.font = '30px monospace';
                ctx.fillText('ПАУЗА', canvas.width/2-60, canvas.height/2);
            } else {
                gameLoop = setInterval(update, 100);
            }
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * (canvas.width/gridSize)),
                    y: Math.floor(Math.random() * (canvas.height/gridSize))
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            return newFood;
        }

        function update() {
            if (!gameRunning || gamePaused) return;
            
            const head = {x: snake[0].x + dx/gridSize, y: snake[0].y + dy/gridSize};
            
            if (head.x < 0 || head.x >= canvas.width/gridSize || 
                head.y < 0 || head.y >= canvas.height/gridSize ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                food = generateFood();
            } else {
                snake.pop();
            }
            
            draw();
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0f0';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize-2, gridSize-2);
            });
            
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize-2, gridSize-2);
        }

        function changeDirection(e) {
            if (!gameRunning || gamePaused) return;
            const key = e.keyCode;
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;
            
            if (key === 37 && !goingRight) { dx = -gridSize; dy = 0; }
            if (key === 38 && !goingDown) { dx = 0; dy = -gridSize; }
            if (key === 39 && !goingLeft) { dx = gridSize; dy = 0; }
            if (key === 40 && !goingUp) { dx = 0; dy = gridSize; }
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        init();
    </script>
</body>
</html>
